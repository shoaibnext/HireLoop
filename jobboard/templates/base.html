<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HireLoop — Tech jobs for Pakistan{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Technology and AI jobs in Pakistan and remote roles open to Pakistani developers.{% endblock %}">
  {% if noindex %}<meta name="robots" content="noindex,follow">{% endif %}
  {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}
  <meta property="og:site_name" content="HireLoop">
  <meta property="og:title" content="{% block og_title %}HireLoop — Tech jobs for Pakistan{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ meta_description|default('Technology and AI jobs in Pakistan and remote roles open to Pakistani developers.') }}{% endblock %}">
  {% if canonical_url %}<meta property="og:url" content="{{ canonical_url }}">{% endif %}
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ meta_title|default('HireLoop — Tech jobs for Pakistan') }}">
  <meta name="twitter:description" content="{{ meta_description|default('Technology and AI jobs in Pakistan and remote roles open to Pakistani developers.') }}">
  <script nonce="{{ request.state.csp_nonce }}" src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,sans-serif;background:#f8f9ff;color:#0b1c30}.focus-visible:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #3525cd;outline-offset:2px}</style>
</head>
<body>
  <a href="#main" class="sr-only focus:not-sr-only">Skip to content</a>
  <header class="border-b bg-white"><nav aria-label="Main navigation" class="mx-auto flex max-w-5xl flex-wrap gap-6 p-4">
    <a href="/" aria-current="page" class="font-bold text-indigo-800">HireLoop</a><a href="/about">About</a><a href="/blog">Career guides</a><a href="/alerts">Daily job alerts</a><a href="/pricing">Employer pricing</a><a href="/post-job">Post a job</a><a href="/login">Employer sign in</a>
  </nav></header>
  <main id="main" class="mx-auto max-w-5xl p-4">{% block content %}{% endblock %}</main>
  <footer class="mx-auto max-w-5xl p-4 text-sm"><a href="/privacy">Privacy</a> · <a href="/contact">Contact</a></footer>
</body>
</html>
