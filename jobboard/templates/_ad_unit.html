{% if ads_enabled and adsense_client and adsense_slot %}
<div class="my-6 min-h-[250px] rounded bg-white p-3" aria-label="Advertisement">
  <ins class="adsbygoogle" style="display:block;min-height:250px" data-ad-client="{{ adsense_client }}" data-ad-slot="{{ adsense_slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
</div>
<script nonce="{{ request.state.csp_nonce }}" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_client }}" crossorigin="anonymous"></script>
<script nonce="{{ request.state.csp_nonce }}">(adsbygoogle = window.adsbygoogle || []).push({});</script>
{% endif %}
