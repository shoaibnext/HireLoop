{% extends "base.html" %}
{% block title %}Employer sign in — HireLoop{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-2xl bg-white p-6 shadow">
  <h1 class="text-3xl font-bold">Employer sign in</h1>
  {% if error %}<p role="alert" class="mt-3 text-red-800">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="mt-6 grid gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email address<input class="mt-1 block min-h-11 w-full rounded border p-3" type="email" name="email" autocomplete="email" required></label>
    <label>Password<input class="mt-1 block min-h-11 w-full rounded border p-3" type="password" name="password" autocomplete="current-password" required></label>
    <button class="min-h-11 rounded bg-indigo-700 px-4 text-white">Sign in</button>
  </form>
  <p class="mt-4">Need an account? <a class="text-indigo-800 underline" href="/signup">Create one</a>.</p>
</section>
{% endblock %}
