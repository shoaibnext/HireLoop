services:
  - type: web
    name: hireloop
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn jobboard.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_DELIVERY_VERIFIED
        value: "0"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        sync: false
      - key: FEATURED_PRICE_PKR
        value: "5000"
      - key: ADS_ENABLED
        value: "0"
      - key: ADSENSE_CLIENT
        sync: false
      - key: ADSENSE_SLOT
        sync: false
