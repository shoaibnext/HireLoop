[tool.vercel]
entrypoint = "jobboard.main:app"

[project]
name = "kaamly-pk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "nh3>=0.2,<1",
    "Markdown>=3.7,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "bcrypt>=4.0.1,<5",
    "itsdangerous>=2.2,<3",
    "Authlib>=1.4,<2",
    "python-multipart>=0.0.20,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "slowapi>=0.1.9,<1",
    "sentry-sdk[fastapi]>=2,<3",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
